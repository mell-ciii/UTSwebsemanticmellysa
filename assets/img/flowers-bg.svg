<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <!-- Background bunga transparan (pink & putih) untuk Florist Mellysa -->
  <defs>
    <!-- Bunga 5 kelopak -->
    <g id="flower">
      <circle cx="0" cy="-19" r="13" fill="#f5a3c3"/>
      <circle cx="18" cy="-6" r="13" fill="#f5a3c3"/>
      <circle cx="11" cy="16" r="13" fill="#f5a3c3"/>
      <circle cx="-11" cy="16" r="13" fill="#f5a3c3"/>
      <circle cx="-18" cy="-6" r="13" fill="#f5a3c3"/>
      <circle cx="0" cy="0" r="8" fill="#ffffff"/>
      <circle cx="0" cy="0" r="4" fill="#ffd1e3"/>
    </g>

    <!-- Kelopak kecil (daun) -->
    <g id="petal">
      <ellipse cx="0" cy="0" rx="9" ry="4" fill="#fbd0e2"/>
    </g>

    <!-- Bunga kecil 4 kelopak -->
    <g id="blossom">
      <circle cx="0" cy="-10" r="7" fill="#fbc4da"/>
      <circle cx="10" cy="0" r="7" fill="#fbc4da"/>
      <circle cx="0" cy="10" r="7" fill="#fbc4da"/>
      <circle cx="-10" cy="0" r="7" fill="#fbc4da"/>
      <circle cx="0" cy="0" r="4" fill="#ffffff"/>
    </g>
  </defs>

  <!-- Sebaran bunga (transparan, tanpa latar) -->
  <use href="#flower" transform="translate(65 70) scale(1.5) rotate(15)" opacity="0.30"/>
  <use href="#flower" transform="translate(305 105) scale(1.0) rotate(-20)" opacity="0.24"/>
  <use href="#flower" transform="translate(185 255) scale(1.8) rotate(5)" opacity="0.20"/>
  <use href="#flower" transform="translate(350 330) scale(1.2) rotate(30)" opacity="0.27"/>
  <use href="#flower" transform="translate(45 345) scale(0.9) rotate(-12)" opacity="0.25"/>

  <use href="#blossom" transform="translate(215 45) scale(1.3)" opacity="0.35"/>
  <use href="#blossom" transform="translate(120 175) scale(1.0)" opacity="0.30"/>
  <use href="#blossom" transform="translate(340 200) scale(0.9)" opacity="0.28"/>
  <use href="#blossom" transform="translate(255 355) scale(1.2)" opacity="0.32"/>

  <use href="#petal" transform="translate(150 105) rotate(35)" opacity="0.40"/>
  <use href="#petal" transform="translate(285 215) rotate(-25)" opacity="0.38"/>
  <use href="#petal" transform="translate(80 250) rotate(60)" opacity="0.36"/>
  <use href="#petal" transform="translate(330 60) rotate(-50)" opacity="0.34"/>
  <use href="#petal" transform="translate(230 150) rotate(18)" opacity="0.30"/>
  <use href="#petal" transform="translate(30 155) rotate(-70)" opacity="0.33"/>
</svg>
