<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="700" viewBox="0 0 1120 700" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <style>
      .box    { fill:#ffffff; stroke:#0d6efd; stroke-width:1.5; rx:6; }
      .head   { fill:#0d6efd; }
      .htitle { fill:#ffffff; font-size:14px; font-weight:bold; }
      .attr   { fill:#212529; font-size:12.5px; }
      .key    { fill:#d63384; font-size:12.5px; font-weight:bold; }
      .rel    { stroke:#6c757d; stroke-width:1.6; fill:none; }
      .lbl    { fill:#495057; font-size:12px; font-weight:bold; }
      .title  { fill:#212529; font-size:20px; font-weight:bold; }
      .sub    { fill:#6c757d; font-size:12.5px; }
    </style>
  </defs>

  <rect width="1120" height="700" fill="#f8f9fa"/>
  <text x="30" y="30" class="title">ERD — Aplikasi Web Marketplace Tradisional (PasarKita)</text>
  <text x="30" y="52" class="sub">Notasi garis: "1" (satu) &rarr; "N" (banyak). PK = Primary Key, FK = Foreign Key, UK = Unique.</text>

  <!-- ================= USERS ================= -->
  <rect class="box" x="40" y="80" width="240" height="205"/>
  <path class="head" d="M40 86 a6 6 0 0 1 6 -6 h228 a6 6 0 0 1 6 6 v22 h-240 z"/>
  <text x="52" y="102" class="htitle">users</text>
  <text x="52" y="130" class="key">id (PK)</text>
  <text x="52" y="149" class="attr">name</text>
  <text x="52" y="168" class="attr">email (UK)</text>
  <text x="52" y="187" class="attr">password</text>
  <text x="52" y="206" class="attr">role</text>
  <text x="52" y="225" class="attr">phone</text>
  <text x="52" y="244" class="attr">address</text>
  <text x="52" y="263" class="attr">store_name</text>
  <text x="52" y="278" class="attr" opacity="0.85">created_at</text>

  <!-- ================= CATEGORIES ================= -->
  <rect class="box" x="810" y="80" width="220" height="110"/>
  <path class="head" d="M810 86 a6 6 0 0 1 6 -6 h208 a6 6 0 0 1 6 6 v22 h-220 z"/>
  <text x="822" y="102" class="htitle">categories</text>
  <text x="822" y="130" class="key">id (PK)</text>
  <text x="822" y="149" class="attr">name</text>
  <text x="822" y="168" class="attr">slug (UK)</text>
  <text x="822" y="185" class="attr" opacity="0.85">created_at</text>

  <!-- ================= PRODUCTS ================= -->
  <rect class="box" x="390" y="80" width="260" height="243"/>
  <path class="head" d="M390 86 a6 6 0 0 1 6 -6 h248 a6 6 0 0 1 6 6 v22 h-260 z"/>
  <text x="402" y="102" class="htitle">products</text>
  <text x="402" y="130" class="key">id (PK)</text>
  <text x="402" y="149" class="attr">seller_id (FK &rarr; users.id)</text>
  <text x="402" y="168" class="attr">category_id (FK &rarr; categories.id)</text>
  <text x="402" y="187" class="attr">name</text>
  <text x="402" y="206" class="attr">slug (UK)</text>
  <text x="402" y="225" class="attr">description</text>
  <text x="402" y="244" class="attr">price</text>
  <text x="402" y="263" class="attr">stock</text>
  <text x="402" y="282" class="attr">image</text>
  <text x="402" y="301" class="attr">status</text>
  <text x="402" y="318" class="attr" opacity="0.85">created_at</text>

  <!-- ================= CARTS ================= -->
  <rect class="box" x="40" y="400" width="260" height="133"/>
  <path class="head" d="M40 406 a6 6 0 0 1 6 -6 h248 a6 6 0 0 1 6 6 v22 h-260 z"/>
  <text x="52" y="422" class="htitle">carts</text>
  <text x="52" y="450" class="key">id (PK)</text>
  <text x="52" y="469" class="attr">user_id (FK &rarr; users.id)</text>
  <text x="52" y="488" class="attr">product_id (FK &rarr; products.id)</text>
  <text x="52" y="507" class="attr">quantity</text>
  <text x="52" y="524" class="attr" opacity="0.85">created_at</text>

  <!-- ================= ORDERS ================= -->
  <rect class="box" x="400" y="400" width="270" height="223"/>
  <path class="head" d="M400 406 a6 6 0 0 1 6 -6 h258 a6 6 0 0 1 6 6 v22 h-270 z"/>
  <text x="412" y="422" class="htitle">orders</text>
  <text x="412" y="450" class="key">id (PK)</text>
  <text x="412" y="469" class="attr">order_code (UK)</text>
  <text x="412" y="488" class="attr">buyer_id (FK &rarr; users.id)</text>
  <text x="412" y="507" class="attr">recipient_name</text>
  <text x="412" y="526" class="attr">phone</text>
  <text x="412" y="545" class="attr">shipping_address</text>
  <text x="412" y="564" class="attr">note</text>
  <text x="412" y="583" class="attr">total_amount</text>
  <text x="412" y="602" class="attr">status</text>
  <text x="412" y="619" class="attr" opacity="0.85">created_at</text>

  <!-- ================= ORDER_ITEMS ================= -->
  <rect class="box" x="760" y="400" width="270" height="171"/>
  <path class="head" d="M760 406 a6 6 0 0 1 6 -6 h258 a6 6 0 0 1 6 6 v22 h-270 z"/>
  <text x="772" y="422" class="htitle">order_items</text>
  <text x="772" y="450" class="key">id (PK)</text>
  <text x="772" y="469" class="attr">order_id (FK &rarr; orders.id)</text>
  <text x="772" y="488" class="attr">product_id (FK &rarr; products.id)</text>
  <text x="772" y="507" class="attr">product_name</text>
  <text x="772" y="526" class="attr">price</text>
  <text x="772" y="545" class="attr">quantity</text>
  <text x="772" y="562" class="attr">subtotal</text>

  <!-- ================= RELATIONSHIPS ================= -->
  <!-- users (1) -> products (N) -->
  <polyline class="rel" points="280,150 390,150"/>
  <text x="292" y="143" class="lbl">1</text>
  <text x="368" y="143" class="lbl">N</text>

  <!-- categories (1) -> products (N) -->
  <polyline class="rel" points="650,110 810,110"/>
  <text x="660" y="103" class="lbl">N</text>
  <text x="792" y="103" class="lbl">1</text>

  <!-- users (1) -> carts (N) -->
  <polyline class="rel" points="120,285 120,400"/>
  <text x="126" y="300" class="lbl">1</text>
  <text x="126" y="392" class="lbl">N</text>

  <!-- users (1) -> orders (N) -->
  <polyline class="rel" points="255,285 405,400"/>
  <text x="262" y="300" class="lbl">1</text>
  <text x="380" y="394" class="lbl">N</text>

  <!-- products (1) -> carts (N) -->
  <polyline class="rel" points="390,255 300,400"/>
  <text x="352" y="270" class="lbl">1</text>
  <text x="304" y="392" class="lbl">N</text>

  <!-- products (1) -> order_items (N) -->
  <polyline class="rel" points="650,280 830,400"/>
  <text x="690" y="300" class="lbl">1</text>
  <text x="806" y="394" class="lbl">N</text>

  <!-- orders (1) -> order_items (N) -->
  <polyline class="rel" points="670,470 760,470"/>
  <text x="678" y="463" class="lbl">1</text>
  <text x="742" y="463" class="lbl">N</text>
</svg>
